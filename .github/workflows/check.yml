name: Universal app checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: jobin-universal-export
          path: dist
