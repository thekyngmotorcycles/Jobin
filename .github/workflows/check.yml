name: Universal app checks
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify SecureStore lock integrity against npm registry
        run: |
          test "$(npm view expo-secure-store@15.0.8 dist.integrity --registry=https://registry.npmjs.org)" = "$(node -p "require('./package-lock.json').packages['node_modules/expo-secure-store'].integrity")"
      - run: npm ci --no-audit --no-fund
      - run: npx expo install --check
      - name: Validate isolated security pilot Expo config (no native build)
        env:
          JOBEEN_SECURITY_PILOT: "1"
          EXPO_PUBLIC_JOBEEN_SECURITY_PILOT: "1"
          EXPO_PUBLIC_SUPABASE_URL: "https://abcdefghijklmnopqrst.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_synthetic-never-used"
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/jobeen-pilot-expo-config.json"
          node scripts/check-security-pilot-config.mjs "$RUNNER_TEMP/jobeen-pilot-expo-config.json"
      - name: Verify security pilot fails closed (no build)
        run: node scripts/test-security-pilot-fail-closed.mjs
      - name: Verify Android native autolinking (no build)
        run: |
          npx --no-install expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/jobeen-autolinking.json"
          node scripts/check-native-autolinking.mjs "$RUNNER_TEMP/jobeen-autolinking.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: jobin-universal-export
          path: dist

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: jobin_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
      - run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f tests/database.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/catalog-migration-idempotence.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/jcards-save-rls.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/business-card-privacy.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/employment-privacy.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/company-verification-privacy.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/social-media-ownership.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/message-jshop-authorization.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/employer-links-authorization.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/security-integration.test.sql
