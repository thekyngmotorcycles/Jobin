name: Expo development OTA (compatible Android auto and explicit manual)
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact development HEAD SHA explicitly approved by the owner for this OTA
        required: true
        type: string
      confirm_ota:
        description: I explicitly approve publishing this OTA to the existing development update branch
        required: true
        type: boolean
        default: false
      platform:
        description: Platforms included in the approved OTA
        required: true
        type: choice
        options:
          - android
          - all
        default: all
      android_runtime:
        description: Runtime matched by the approved Android APK
        required: true
        type: choice
        options:
          - fingerprint
          - jobeen-native-20261123
          - jobeen-native-20261123-feed-4425bdf1
        default: fingerprint
  workflow_call:
    inputs:
      approved_commit:
        required: true
        type: string
      confirm_ota:
        required: true
        type: boolean
      platform:
        required: true
        type: string
      android_runtime:
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: expo-development-ota-manual
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'thekyngmotorcycles/Jobin' &&
      github.actor == 'thekyngmotorcycles' &&
      github.ref == 'refs/heads/development' &&
      inputs.confirm_ota == true &&
      inputs.approved_commit == github.sha &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'push' &&
        github.workflow_ref == 'thekyngmotorcycles/Jobin/.github/workflows/check.yml@refs/heads/development' &&
        github.triggering_actor == 'thekyngmotorcycles' &&
        github.run_attempt == '1' &&
        inputs.platform == 'android' &&
        inputs.android_runtime == 'jobeen-native-20261123-feed-4425bdf1')) &&
      (inputs.android_runtime == 'fingerprint' ||
       (inputs.android_runtime == 'jobeen-native-20261123' && inputs.platform == 'android') ||
       (inputs.android_runtime == 'jobeen-native-20261123-feed-4425bdf1' && inputs.platform == 'android'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved commit without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate live project identity; never use isolated pilot for an OTA
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const expo = JSON.parse(readFileSync('app.json', 'utf8')).expo;
          const liveId = 'a6befb1a-dc03-45a8-a18c-294643e99434';
          if (expo.extra?.eas?.projectId !== liveId ||
              expo.updates?.url !== `https://u.expo.dev/${liveId}` ||
              (process.env.EXPO_PROJECT_ID && process.env.EXPO_PROJECT_ID !== liveId)) {
            throw new Error('Expo project/updates URL mismatch; OTA refused.');
          }
          if (process.env.JOBEEN_SECURITY_PILOT === '1' ||
              process.env.EXPO_PUBLIC_JOBEEN_SECURITY_PILOT === '1') {
            throw new Error('Security-pilot runtime must never publish OTA.');
          }
          JS
      - run: npm ci --no-audit --no-fund
      # Automatic calls have already passed both CI jobs on the identical commit.
      - run: npx expo install --check
        if: github.event_name == 'workflow_dispatch'
      - run: npm run lint
        if: github.event_name == 'workflow_dispatch'
      - run: npm run typecheck
        if: github.event_name == 'workflow_dispatch'
      - run: npm test
        if: github.event_name == 'workflow_dispatch'
      - name: Match the November 23 Android APK runtime
        if: inputs.android_runtime == 'jobeen-native-20261123'
        env:
          OTA_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          test "$OTA_PLATFORM" = android
          # EAS build 7a5e4641-d586-42d3-909f-3656371d6429, source 689c965b.
          native_tree=$(git ls-tree -r --full-tree HEAD -- app.json app.config.js app.config.ts package.json package-lock.json modules android ios .fingerprintignore fingerprint.config.js fingerprint.config.ts | sha256sum | cut -d ' ' -f 1)
          preview_profile=$(jq -cS '.build.preview' eas.json | sha256sum | cut -d ' ' -f 1)
          test "$native_tree" = '7ad050624404797d3485144dc72f3ac52fa86647816a6a1bbead545b3ab522c4' &&
          test "$preview_profile" = '03be88ff905c211430e60648ce0ef98968056ce7efd48b450be070ea82468cca' ||
          { echo "::error::The source no longer matches this APK's native configuration"; exit 1; }
          node <<'JS'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { resolveRuntimeVersionAsync } = require('expo-updates/utils/build/resolveRuntimeVersionAsync');
          const config = JSON.parse(readFileSync('app.json', 'utf8'));
          const runtime = 'jobeen-native-20261123';
          config.expo.android.runtimeVersion = runtime;
          writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          resolveRuntimeVersionAsync(process.cwd(), 'android', {}, { workflowOverride: 'managed' }).then(result => {
            if (result.runtimeVersion !== runtime) throw Error('Android runtime mismatch');
            console.log('Android OTA runtime: ' + result.runtimeVersion);
          }).catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          JS
      - name: Match the consolidated feed APK runtime
        if: inputs.android_runtime == 'jobeen-native-20261123-feed-4425bdf1'
        env:
          OTA_PLATFORM: ${{ inputs.platform }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$OTA_PLATFORM" = android
          test -n "$EXPO_TOKEN"
          BASE=4425bdf1b39d3085033e77296dac2ec4a528f443
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- app.json app.config.js app.config.ts eas.json package.json package-lock.json modules android ios plugins .gitignore .easignore .fingerprintignore fingerprint.config.js fingerprint.config.ts babel.config.js metro.config.js
          node --input-type=module <<'JS'
          const appId='a6befb1a-dc03-45a8-a18c-294643e99434';
          const buildId='4497923f-9f26-47ae-bfd9-92864b677028';
          const runtime='jobeen-native-20261123-feed-4425bdf1';
          const response=await fetch('https://api.expo.dev/graphql',{
            method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+process.env.EXPO_TOKEN},
            body:JSON.stringify({query:'query VerifiedPreview($appId: String!) { app { byId(appId: $appId) { builds(offset: 0, limit: 20) { id status platform runtime { version } buildProfile artifacts { buildUrl applicationArchiveUrl } } } } }',variables:{appId}})
          });
          const result=await response.json();
          if(!response.ok||result.errors)throw Error('Unable to verify the approved Expo build.');
          const build=result.data?.app?.byId?.builds?.find(item=>item.id===buildId);
          if(!build||build.status!=='FINISHED'||String(build.platform).toUpperCase()!=='ANDROID'||build.buildProfile!=='preview'||build.runtime?.version!==runtime||!(build.artifacts?.buildUrl||build.artifacts?.applicationArchiveUrl))
            throw Error('The approved installed Android APK is not verified.');
          console.log('Verified APK '+buildId+' runtime '+runtime);
          JS
          node <<'JS'
          const {readFileSync,writeFileSync}=require('node:fs');
          const {resolveRuntimeVersionAsync}=require('expo-updates/utils/build/resolveRuntimeVersionAsync');
          const config=JSON.parse(readFileSync('app.json','utf8'));
          const runtime='jobeen-native-20261123-feed-4425bdf1';
          if(config.expo?.runtimeVersion?.policy!=='fingerprint'||config.expo.android?.package!=='com.thekyngmotorcycles.jobin')throw Error('Unexpected APK config');
          config.expo.android.runtimeVersion = runtime;
          writeFileSync('app.json',JSON.stringify(config,null,2)+'\n');
          resolveRuntimeVersionAsync(process.cwd(),'android',{}, {workflowOverride:'managed'}).then(result=>{
            if (result.runtimeVersion !== runtime) throw Error('Android runtime mismatch');
            console.log('Android OTA runtime: '+result.runtimeVersion);
          }).catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
      - name: Verify the approved commit is still current development
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url='https://api.github.com/repos/thekyngmotorcycles/Jobin/git/ref/heads/development';
          const res=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_READ_TOKEN,Accept:'application/vnd.github+json'}});
          if(!res.ok)throw Error('Unable to verify current development HEAD');
          const ref=await res.json();
          if(ref.object?.sha!==process.env.GITHUB_SHA)throw Error('Development advanced; stale OTA refused.');
          JS
      - name: Publish only the explicitly approved OTA (no builds, Git pushes or channel changes)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "::error::Commit mismatch"; exit 1; }
          case "$OTA_PLATFORM" in
            android|all) ;;
            *) echo "::error::Invalid OTA platform"; exit 1 ;;
          esac
          npx eas-cli@27.1.0 update --branch development --environment preview --platform "$OTA_PLATFORM" --message "Jobin approved OTA $GITHUB_SHA" --non-interactive --json > "$RUNNER_TEMP/expo-update.json"
          jq -c 'if type == "array" then .[] | {id, group, runtimeVersion, platform} else empty end' "$RUNNER_TEMP/expo-update.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jobeen-approved-development-ota
          path: ${{ runner.temp }}/expo-update.json
          if-no-files-found: error
