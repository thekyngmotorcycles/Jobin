name: Check main and publish Jobin development
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/navigation-card-update.yml]
permissions:
  contents: read
concurrency:
  group: expo-development
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check main
        run: npm run check
      - name: Publish main source to development updates
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN repository secret is missing"; exit 1; }
          npx eas-cli@27.1.0 update --branch development --environment preview --platform all --non-interactive --message "Jobin JCard, verification and media safety" --json > navigation-card-update.json
      - name: Report update IDs
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('navigation-card-update.json', 'utf8'));
          const updates = Array.isArray(payload) ? payload : (payload.updates || [payload]);
          for (const u of updates) {
            const summary = {id:u.id,group:u.group,platform:u.platform,runtimeVersion:u.runtimeVersion,gitCommitHash:u.gitCommitHash};
            console.log('JOBIN_UPDATE ' + JSON.stringify(summary));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(summary) + '\n\n');
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-card-update
          path: navigation-card-update.json
          if-no-files-found: ignore
