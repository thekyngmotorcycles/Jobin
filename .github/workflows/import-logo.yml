name: Import Jobin logo reference
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-logo.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download public image reference
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from "node:fs";
          const response=await fetch("https://drive.google.com/uc?export=download&id=1XJm02TR2iIgt5uYGSBNqYYLS4-3T7iH2",{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error("Drive download failed: "+response.status);
          const bytes=Buffer.from(await response.arrayBuffer());
          if(bytes.length>10*1024*1024)throw new Error("Image exceeds 10 MB.");
          const png=bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]));
          const jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255;
          const webp=bytes.toString("ascii",0,4)==="RIFF"&&bytes.toString("ascii",8,12)==="WEBP";
          const gif=bytes.toString("ascii",0,3)==="GIF";
          if(!png&&!jpg&&!webp&&!gif){
            console.log(JSON.stringify({contentType:response.headers.get("content-type"),signature:bytes.subarray(0,16).toString("hex"),isHtml:bytes.toString("utf8",0,500).toLowerCase().includes("<!doctype html"),signInRequired:/accounts.google.com|ServiceLogin|You need access|Request access/.test(bytes.toString("utf8")),downloadConfirmation:/download-form|confirm=/.test(bytes.toString("utf8"))}));
            throw new Error("The public download did not return an image.");
          }
          const extension=png?"png":jpg?"jpg":webp?"webp":"gif";
          const path="assets/images/jobin-logo."+extension;
          mkdirSync("assets/images",{recursive:true});
          writeFileSync(path,bytes);
          console.log(JSON.stringify({path,bytes:bytes.length,format:extension,width:png?bytes.readUInt32BE(16):undefined,height:png?bytes.readUInt32BE(20):undefined}));
          NODE
      - name: Save reference image in development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if ! git diff --cached --quiet; then
            git commit -m "Import user-provided Jobin logo reference"
            git push origin HEAD:development
          fi
