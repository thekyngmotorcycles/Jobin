name: Read Jobin diagnostic screenshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-logo.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare OCR reader
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr
          fi
      - name: Read public screenshot without publishing the image
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,unlinkSync} from "node:fs";
          import {execFileSync} from "node:child_process";
          const response=await fetch("https://drive.google.com/uc?export=download&id=1XJm02TR2iIgt5uYGSBNqYYLS4-3T7iH2",{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error("Drive download failed: "+response.status);
          const bytes=Buffer.from(await response.arrayBuffer());
          if(bytes.length>10*1024*1024)throw new Error("Screenshot exceeds 10 MB.");
          const png=bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]));
          const jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255;
          const webp=bytes.toString("ascii",0,4)==="RIFF"&&bytes.toString("ascii",8,12)==="WEBP";
          const gif=bytes.toString("ascii",0,3)==="GIF";
          if(!png&&!jpg&&!webp&&!gif)throw new Error("Drive still did not return a public image.");
          const path="/tmp/jobin-diagnostic."+(png?"png":jpg?"jpg":webp?"webp":"gif");
          writeFileSync(path,bytes);
          try{
            const text=execFileSync("tesseract",[path,"stdout","--psm","11"],{encoding:"utf8",maxBuffer:1024*1024});
            const safe=text.replace(/sb_(secret|publishable)_[A-Za-z0-9_-]+/g,"[REDACTED_KEY]").replace(/eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+/g,"[REDACTED_JWT]").replace(/[A-Za-z0-9_-]{35,}/g,"[REDACTED_IDENTIFIER]").replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/g,"[REDACTED_EMAIL]");
            console.log("OCR_BEGIN");console.log(safe);console.log("OCR_END");
          }finally{unlinkSync(path);}
          NODE
