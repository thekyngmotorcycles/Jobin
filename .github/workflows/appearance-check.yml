name: Appearance matrix
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/appearance/**', '.github/workflows/appearance-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/appearance/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-matrix
          path: appearance-results
