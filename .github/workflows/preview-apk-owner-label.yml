name: Jobeen preview APK - owner-approved one-shot
run-name: Jobeen preview APK of ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: jobeen-preview-owner-approved-apk
  cancel-in-progress: false

jobs:
  preview-apk:
    # GitHub connector cannot dispatch workflow_dispatch; a label applied by the
    # repository owner is the explicit manual trigger. Only this same-repo PR.
    if: >-
      github.repository == 'thekyngmotorcycles/Jobin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/preview-native-one-apk-20261123' &&
      github.event.pull_request.base.ref == 'development' &&
      github.event.label.name == 'approve-preview-native-apk' &&
      github.actor == 'thekyngmotorcycles' &&
      github.triggering_actor == 'thekyngmotorcycles' &&
      github.event.sender.login == 'thekyngmotorcycles'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact approved commit, no Git write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Assert original Expo identity and approved PR SHA
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const a = JSON.parse(readFileSync('app.json','utf8')).expo;
          const e = JSON.parse(readFileSync('eas.json','utf8')).build.preview;
          if (a.extra?.eas?.projectId !== 'a6befb1a-dc03-45a8-a18c-294643e99434' ||
              a.android?.package !== 'com.thekyngmotorcycles.jobin' ||
              e?.distribution !== 'internal' || e?.android?.buildType !== 'apk' ||
              e?.environment !== 'preview' || process.env.JOBEEN_SECURITY_PILOT === '1') {
            throw new Error('Original Jobeen Expo identity or APK preview profile mismatch.');
          }
          JS
      - name: Ignore the unused pilot profile only in this runner's EAS configuration
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const file='eas.json';
          const config=JSON.parse(readFileSync(file,'utf8'));
          if(config.build?.preview?.android?.buildType!=='apk' ||
             config.build?.['security-pilot']?.env?.EXPO_PUBLIC_PRIVATE_VIDEO_UPLOAD_URL!=='') {
            throw new Error('Unexpected EAS profiles: original preview APK cannot proceed.');
          }
          // EAS CLI 27 rejects an empty value in ANY profile, even an unused one.
          // The source repository and isolated pilot safety configuration stay unchanged.
          delete config.build['security-pilot'];
          writeFileSync(file,JSON.stringify(config,null,2));
          console.log('Using original preview profile; isolated pilot profile removed from runner copy only.');
          JS
      - name: Use a unique runtime version for this native APK in runner only
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='app.json', config=JSON.parse(readFileSync(file,'utf8'));
          if(config.expo?.runtimeVersion?.policy!=='fingerprint' ||
             config.expo?.extra?.eas?.projectId!=='a6befb1a-dc03-45a8-a18c-294643e99434')
            throw Error('Unexpected Expo app identity or runtime policy');
          // Local and builder fingerprints diverge after native prebuild/autolinking.
          // Use an isolated runtime string so older OTA bundles cannot target this APK.
          config.expo.runtimeVersion='jobeen-native-20261123';
          writeFileSync(file,JSON.stringify(config,null,2));
          console.log('One APK runtime is jobeen-native-20261123; OTA requires matching runtime.');
          JS
      - name: Build original Jobeen preview APK (only after owner labeled)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN missing"; exit 1; }
          npx --yes eas-cli@27.1.0 build --profile preview --platform android --non-interactive --wait --json > "$RUNNER_TEMP/jobeen-preview-build.json"
      - name: Report APK URL without tokens
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const filename=process.env.RUNNER_TEMP+'/jobeen-preview-build.json';
          const result=JSON.parse(readFileSync(filename,'utf8'));
          for(const b of (Array.isArray(result)?result:[result])){
            const info={ id:b.id, status:b.status, url:b.artifacts?.buildUrl ?? b.artifacts?.applicationArchiveUrl ?? null };
            console.log('JOBEEN_PREVIEW_APK '+JSON.stringify(info));
            console.log('Build status and link are also available in Expo > Builds.');
          }
          JS
  diagnose-preview-apk:
    # Diagnostic only: no EAS build, no build-profile edits, no rerun of native compilation.
    if: >-
      github.repository == 'thekyngmotorcycles/Jobin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/preview-native-one-apk-20261123' &&
      github.event.pull_request.base.ref == 'development' &&
      github.event.label.name == 'diagnose-preview-native-apk' &&
      github.actor == 'thekyngmotorcycles' &&
      github.event.sender.login == 'thekyngmotorcycles'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect existing APK only (no EAS build)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 100 --output "$RUNNER_TEMP/existing.apk" 'https://expo.dev/artifacts/eas/xq2sf6sA-vKFESVawyBMwSpLKW07-bSJ090KkgkhenQ.apk'
          python3 - <<'PY'
          import os, struct, zipfile, hashlib, re
          p=os.path.join(os.environ["RUNNER_TEMP"],"existing.apk")
          print("APK_SHA256", hashlib.file_digest(open(p,"rb"),"sha256").hexdigest())
          target="Lexpo/modules/jobeenprivatefiles/JobeenPrivateFilesModule;"
          found=False
          provider=False
          names=set()
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  if not re.fullmatch(r"classes(?:[0-9]+)?\.dex",name): continue
                  b=z.read(name)
                  u=lambda p: struct.unpack_from("<I",b,p)[0]
                  sc,so,tc,to=u(56),u(60),u(64),u(68)
                  cc,co=u(96),u(100)
                  def string(idx):
                      p=u(so+4*idx)
                      while b[p]&128: p+=1
                      p+=1
                      return b[p:b.index(0,p)].decode("utf-8",errors="replace")
                  for j in range(cc):
                      cls=string(u(to+4*u(co+j*32)))
                      if cls==target: found=True
                      if "ExpoModulesPackageList" in cls or "ExpoModulesProvider" in cls: provider=True
                  for token in [b"JobeenPrivateFiles",b"readPicked",b"discardImagePickerCopy"]:
                      if token in b: names.add(token.decode())
          print("APK_PRIVATE_CLASS_DEFINED",found)
          print("APK_EXPO_PROVIDER_DEFINED",provider)
          print("APK_PRIVATE_SYMBOLS",sorted(names))
          PY
      - name: Read relevant existing EAS build log evidence
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const appId='a6befb1a-dc03-45a8-a18c-294643e99434', buildId='7a5e4641-d586-42d3-909f-3656371d6429';
          const r=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{Authorization:'Bearer '+process.env.EXPO_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({query:'query ExistingBuild($appId: String!) { app { byId(appId: $appId) { builds(offset: 0, limit: 10) { id status logFiles } } } }',variables:{appId}}),signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Expo status unavailable');
          const b=(await r.json()).data?.app?.byId?.builds?.find(x=>x.id===buildId);
          if(!b)throw Error('Build unavailable');
          console.log('EXPO_BUILD_STATUS',b.status);
          let logs=0, mentions=0, compiles=0;
          for(const url of b.logFiles??[]){
            try{
              const res=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!res.ok)continue;
              logs++;
              for(const line of (await res.text()).split('\n')){
                if(/jobeen-private-files|jobeenprivatefiles|JobeenPrivateFilesModule/i.test(line))mentions++;
                if(/:jobeen-private-files:compile.*Kotlin/i.test(line))compiles++;
              }
            }catch{}
          }
          console.log('EXPO_LOG_EVIDENCE',JSON.stringify({logs,mentions,compiles}));
          JS
