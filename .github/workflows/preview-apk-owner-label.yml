name: Jobeen preview APK - owner-approved one-shot
run-name: Jobeen preview APK of ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: jobeen-preview-owner-approved-apk
  cancel-in-progress: false

jobs:
  preview-apk:
    # GitHub connector cannot dispatch workflow_dispatch; a label applied by the
    # repository owner is the explicit manual trigger. Only this same-repo PR.
    if: >-
      github.repository == 'thekyngmotorcycles/Jobin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/preview-native-one-apk-20261123' &&
      github.event.pull_request.base.ref == 'development' &&
      github.event.label.name == 'approve-preview-native-apk' &&
      github.actor == 'thekyngmotorcycles' &&
      github.triggering_actor == 'thekyngmotorcycles' &&
      github.event.sender.login == 'thekyngmotorcycles'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact approved commit, no Git write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Assert original Expo identity and approved PR SHA
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const a = JSON.parse(readFileSync('app.json','utf8')).expo;
          const e = JSON.parse(readFileSync('eas.json','utf8')).build.preview;
          if (a.extra?.eas?.projectId !== 'a6befb1a-dc03-45a8-a18c-294643e99434' ||
              a.android?.package !== 'com.thekyngmotorcycles.jobin' ||
              e?.distribution !== 'internal' || e?.android?.buildType !== 'apk' ||
              e?.environment !== 'preview' || process.env.JOBEEN_SECURITY_PILOT === '1') {
            throw new Error('Original Jobeen Expo identity or APK preview profile mismatch.');
          }
          JS
      - name: Ignore the unused pilot profile only in this runner's EAS configuration
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          const file='eas.json';
          const config=JSON.parse(readFileSync(file,'utf8'));
          if(config.build?.preview?.android?.buildType!=='apk' ||
             config.build?.['security-pilot']?.env?.EXPO_PUBLIC_PRIVATE_VIDEO_UPLOAD_URL!=='') {
            throw new Error('Unexpected EAS profiles: original preview APK cannot proceed.');
          }
          // EAS CLI 27 rejects an empty value in ANY profile, even an unused one.
          // The source repository and isolated pilot safety configuration stay unchanged.
          delete config.build['security-pilot'];
          writeFileSync(file,JSON.stringify(config,null,2));
          console.log('Using original preview profile; isolated pilot profile removed from runner copy only.');
          JS
      - name: Build original Jobeen preview APK (only after owner labeled)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN missing"; exit 1; }
          npx --yes eas-cli@27.1.0 build --profile preview --platform android --non-interactive --wait --json > "$RUNNER_TEMP/jobeen-preview-build.json"
      - name: Report APK URL without tokens
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const filename=process.env.RUNNER_TEMP+'/jobeen-preview-build.json';
          const result=JSON.parse(readFileSync(filename,'utf8'));
          for(const b of (Array.isArray(result)?result:[result])){
            const info={ id:b.id, status:b.status, url:b.artifacts?.buildUrl ?? b.artifacts?.applicationArchiveUrl ?? null };
            console.log('JOBEEN_PREVIEW_APK '+JSON.stringify(info));
            console.log('Build status and link are also available in Expo > Builds.');
          }
          JS
  diagnose-preview-apk:
    # Diagnostic only: no EAS build, no build-profile edits, no rerun of native compilation.
    if: >-
      github.repository == 'thekyngmotorcycles/Jobin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/preview-native-one-apk-20261123' &&
      github.event.pull_request.base.ref == 'development' &&
      github.event.label.name == 'diagnose-preview-native-apk' &&
      github.actor == 'thekyngmotorcycles' &&
      github.event.sender.login == 'thekyngmotorcycles'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read one failed EAS build and redact log messages
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const appId='a6befb1a-dc03-45a8-a18c-294643e99434';
          const buildId='795c16c9-ee0f-4844-94d1-5f851f29448f';
          const token=process.env.EXPO_TOKEN;
          if(!token)throw Error('EXPO_TOKEN missing');
          const resp=await fetch('https://api.expo.dev/graphql',{
            method:'POST',
            headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({query:'query FailedPreviewBuild($appId: String!) { app { byId(appId: $appId) { builds(offset: 0, limit: 10) { id status logFiles error { message errorCode } } } } }',variables:{appId}}),
            signal:AbortSignal.timeout(20000),
          });
          if(!resp.ok)throw Error('Expo build status HTTP '+resp.status);
          const payload=await resp.json();
          if(payload.errors?.length)throw Error('Expo project query refused (no sensitive details printed)');
          const build=payload.data?.app?.byId?.builds?.find(x=>x.id===buildId);
          if(!build)throw Error('Failed Expo build ID not found among latest 10');
          const redact=s=>String(s??'').replace(/sb_(?:publishable|secret)_[A-Za-z0-9_-]+/g,'[REDACTED]').replace(/eyJ[A-Za-z0-9._-]+/g,'[REDACTED]').replace(/(pk|sk)[.][A-Za-z0-9._-]+/g,'[REDACTED]');
          console.log('EXPO_BUILD_DIAG',JSON.stringify({id:build.id,status:build.status,code:build.error?.errorCode??null,message:redact(build.error?.message).slice(0,400)}));
          for(const url of (build.logFiles??[]).slice(-2)){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
              if(!response.ok)continue;
              const rows=(await response.text()).split(String.fromCharCode(10)).filter(Boolean);
              const lines=rows.flatMap(t=>{try{const o=JSON.parse(t);return typeof o.msg==='string'?[{phase:o.phase,msg:o.msg}]:[]}catch{return []}});
              const relevant=lines.filter(o=>/(?:error|failed|failure|what went wrong|could not|exception|missing|compile|gradle|cannot|kotlin|CMake|resource linking)/i.test(o.msg)).slice(-22);
              console.log('EXPO_BUILD_LOG_LINES',JSON.stringify(relevant.map(o=>({phase:o.phase,msg:redact(o.msg).slice(0,420)}))));
              const updates=lines.filter(o=>o.phase==='CONFIGURE_EXPO_UPDATES').slice(-14);
              console.log('EXPO_UPDATES_DETAIL',JSON.stringify(updates.map(o=>({msg:redact(o.msg).slice(-1900)}))));
            }catch{console.log('One Expo log file was unavailable; no credentials exposed');}
          }
          JS
